[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-digitizer"
version = "0.1.0"
description = "智能数学试卷排版工具 - 将 LLM 生成的 JSON 转换为 LaTeX 试卷 PDF"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["latex", "exam", "math", "ocr", "pdf", "digitizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = [
    "customtkinter>=5.2.2",
    "google-genai",
    "jinja2>=3.1.6",
    "numpy>=2.0.0,<2.4.0",
    "opencv-python>=4.11.0.86",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "pyperclip>=1.9.0",
    "rich>=13.0.0",
    "doclayout-yolo>=0.0.2",
    "huggingface-hub>=0.20.0",
    "dill>=0.4.0",
    "gradio>=6.3.0",
    "openai>=1.0.0",
    # Config management
    "pydantic>=2.0.0",
    "platformdirs>=4.0.0",
    "keyring>=25.0.0",
    # PyTorch - 通过 tool.uv.sources 指定 index
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
layout_pp = ["paddlepaddle", "paddleocr"]

[project.urls]
Homepage = "https://github.com/jz315/AI-Powered-Exam-Digitizer"
Repository = "https://github.com/jz315/AI-Powered-Exam-Digitizer"
Issues = "https://github.com/jz315/AI-Powered-Exam-Digitizer/issues"

[project.scripts]
math-digitizer = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["math_digitizer*"]
exclude = ["output", "output.*", "temp_build", "temp_build.*", ".venv", ".venv.*", "dist", "build"]

# ============================================
# uv PyTorch 配置
# 参考: https://docs.astral.sh/uv/guides/integration/pytorch/
# ============================================

# Windows 使用 CUDA 12.4，macOS 使用 CPU（PyPI 默认）
# [tool.uv.sources]
# torch = [
#     { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
# ]
# torchvision = [
#     { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
# ]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools.package-data]
math_digitizer = ["resources/*.txt", "resources/*.md"]
